# Continuous integration for the agent-demo app: lint, the repo's own test script, and
# a production build on every pull request and on push to `main`.
# Catches type/build breakage before the cache-zip workflow ships from main.
#
# R3-648 — until this landed, this repo's workflows were `cache.yml` alone: the Pages
# cache-zip publisher, which runs on push to main and runs no checks. So nothing ran on a
# pull request, and a PR here merged on the author's word that they had run the suite
# locally. R3-641 is the evidence against trusting that: a symbol nothing imported reached
# site-main's `main` while its PR reported success, because the leg that would have caught
# it was not a CI step.
#
# Modelled on the merged `whiteboard` workflow deliberately — one shape across the app
# repos, not a fifth. R3-648 took that shape from `file-explorer`/`editor`; the one place
# this file departs from it is the Lint step, for the reason stated there.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run — on a PR branch only. A push
# run gets its own group (the SHA), so it can never be cancelled by a later merge: sharing
# one group across `main` leaves a superseded commit with a CANCELLED verdict rather than
# a green one, which matters the moment a check is required or someone bisects `main` by
# check status.
#
# `workflow_dispatch` — the third trigger this workflow declares — takes the non-push arm,
# so a manual run shares the bare `ci-<ref>` group and is not cancelled in flight.
# Harmless, and named because it is the one case where GitHub's one-pending-run-per-group
# rule still applies.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA (see cache.yml rationale).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run lint` is the gate: `--max-warnings 0` lives in the script, so the string a
      # contributor runs and the string CI runs are the same one.
      #
      # This is the one place this file departs from the workflow it is modelled on.
      # R3-648 wrote the step as `npm run lint -- --max-warnings 0` in the three repos it
      # landed in; R3-653's review found that form leaves `npm run lint` lax and turns the
      # difference into something a contributor has to know. R3-656 IS MOVING IT — eleven
      # open PRs as this lands, none merged yet — so this file uses the destination shape
      # rather than landing the old one and needing a follow-up the same day.
      #
      # Why the flag matters here, measured in this repo on Node 22.22.2 rather than
      # inherited from the sibling that carried the argument: three rules are warn-level
      # (`react-hooks/exhaustive-deps`, `react-hooks/incompatible-library`,
      # `react-hooks/unsupported-syntax`), and
      # `npx eslint src/App.tsx --rule '{"max-lines":["warn",1]}'` exits 0 while the same
      # command with `--max-warnings 0` exits 1. So an exhaustive-deps violation merged
      # green until this workflow existed.
      - name: Lint
        run: npm run lint

      # The repo's OWN `test` script, not a bare `vitest`: it runs
      # `gen-sdk-skill.mjs --check` first, which is the drift gate for the generated SDK
      # skill map. A workflow that called the runner directly would skip it and the map
      # could rot unnoticed — R3-648 Do 2.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
